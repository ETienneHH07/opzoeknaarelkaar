<!DOCTYPE html>
<html lang="nl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Op zoek naar elkaar</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			font-family: 'Roboto', sans-serif;
			background: #000;
		}

		.opening-page {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #000;
			color: #fff;
		}

		.background-video {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			filter: saturate(0.85) contrast(0.95);
			transform: scale(1.02);
		}

		.overlay {
			position: absolute;
			inset: 0;
			background:
				linear-gradient(to bottom, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.52)),
				radial-gradient(circle at center, rgba(0, 0, 0, 0.08) 0%, rgba(0, 0, 0, 0.38) 100%);
			pointer-events: none;
		}

		.brand {
			position: absolute;
			top: 16px;
			left: 16px;
			width: 34px;
			height: 34px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #d8181e;
			color: #fff;
			font-size: 10px;
			font-weight: 800;
			line-height: 0.95;
			letter-spacing: 0.04em;
			text-align: center;
			text-transform: uppercase;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
			z-index: 2;
		}

		.hero {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 24px;
			z-index: 1;
		}

		.hero-title {
			max-width: 980px;
			font-family: 'Roboto Condensed', sans-serif;
			font-weight: bolder;
			font-size: 125px;
			line-height: 0.92;
			font-weight: 900;
			
			text-transform: uppercase;
			
		}

		.hero-subtitle {
			max-width: 760px;
			margin-top: 18px;
			font-family: Georgia, "Times New Roman", serif;
			font-size: clamp(1.1rem, 2.2vw, 1.7rem);
			line-height: 1.35;
			font-weight: 400;
			color: rgba(255, 255, 255, 0.94);
			text-shadow: 0 4px 18px rgba(0, 0, 0, 0.38);
		}

		.cta-wrap {
			position: absolute;
			left: 50%;
			bottom: 26px;
			transform: translateX(-50%);
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 8px;
			z-index: 2;
			color: rgba(255, 255, 255, 0.96);
			text-align: center;
		}

		.swipe-icon {
			width: 22px;
			height: 22px;
			display: block;
			animation: float 1.6s ease-in-out infinite;
			filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45));
		}

		.cta-text {
			font-size: 10px;
			line-height: 1.2;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			font-weight: 500;
			text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
		}

		.enter-link {
			position: absolute;
			inset: 0;
			z-index: 3;
			text-indent: -9999px;
			overflow: hidden;
		}

		@keyframes float {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(6px); }
		}

		@media (max-width: 768px) {
			.brand {
				top: 14px;
				left: 14px;
				width: 30px;
				height: 30px;
				font-size: 9px;
			}

			.hero-title {
				max-width: 92vw;
			}

			.hero-subtitle {
				max-width: 86vw;
				margin-top: 14px;
			}
		}
	</style>
</head>
<body>
	<main class="opening-page">
		<video class="background-video" autoplay muted loop playsinline src="assets/MVI_9161.MP4"></video>
		<div class="overlay"></div>

		<div class="brand">ZU<br>YD</div>

		<section class="hero">
			<h1 class="hero-title">Op zoek naar elkaar</h1>
			<p class="hero-subtitle">
				Hoe zorgen we ervoor dat inwoners hun stem laten horen,
				als juist zij het moeilijkst te bereiken zijn?
			</p>
		</section>

		

		<div class="cta-wrap" aria-hidden="true">
			<svg class="swipe-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
				<path d="M12 2v14m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
			<div class="cta-text">Swipe om het verhaal te verkennen</div>
		</div>
	</main>
	<script>
		let touchStartY = 0;

		document.addEventListener('touchstart', e => {
			touchStartY = e.touches[0].clientY;
		}, { passive: true });

		document.addEventListener('touchend', e => {
			const delta = touchStartY - e.changedTouches[0].clientY;
			if (delta > 60) {
				window.location.href = 'video.html';
			}
		}, { passive: true });

		document.addEventListener('wheel', e => {
			if (e.deltaY > 40) {
				window.location.href = 'video.html';
			}
		}, { passive: true });
	</script>
</body>
</html>
