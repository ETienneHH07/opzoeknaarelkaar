<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wie zijn wij?</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body style="overflow: hidden;">
  <div class="scene">
    <video class="bg-img" id="bgImg" autoplay playsinline src="assets/export1-Britt.mp4"></video>


    <div class="tl-bar">
      <div class="tl-top-row">
        <div class="tl-track-col">
          <div class="tl-line" id="track">
            <div class="tl-filled" id="filled"></div>
            <div class="tl-handle" id="handle"></div>
            <div class="tl-handle-ring" id="handleRing">
              <div class="tl-chapter-name" id="chapterName">Chapter 1</div>
            </div>
          </div>
          <div class="tl-ticks" id="ticks"></div>
        </div>
      </div>
    </div>

    <div class="nav-buttons">
      <a href="cijfers.html" class="nav-btn" title="The Numbers">
        The Numbers
      </a>
      <a href="chapters.html" class="nav-btn" title="Contact">
        Contact
      </a>
    </div>

    <button id="nextBtn" class="next-chapter-btn" title="Next Chapter">
      <span id="nextChapterName">Chapter 2</span>
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor" />
      </svg>

    </button>

    <div id="miniMapWrap" onclick="openFullMap()">
      <div id="mmHeader">
        <span class="mm-label">Wijkkaart</span>
        <button class="mm-expand" type="button" onclick="event.stopPropagation(); openFullMap();">Open kaart</button>
      </div>
      <div id="miniMapEl"></div>
    </div>

    <div id="mapOverlay">
      <div id="mapOverlayHeader">
        <div style="display:flex;align-items:baseline;gap:.8rem">
          <span class="mo-title">De Wijk in Kaart</span>
          <span class="mo-subtitle">Kerkrade-West · hotspots</span>
        </div>
        <button id="mapCloseBtn" onclick="closeFullMap()">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
          Sluiten
        </button>
      </div>
      <div id="fullMapEl"></div>
      <div id="mapFilterPanel">
        <div class="mfp-title">Filter</div>
        <button class="mfp-btn on" data-cat="locaties" onclick="toggleMapFilter(this)">
          <div class="mfp-dot" style="background:#27ae60"></div><span class="mfp-lbl">Locaties</span>
        </button>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const video = document.getElementById('bgImg');
    if (video) {
      video.play().catch(() => {
        console.log('Autoplay blocked, retrying...');
      });
      document.addEventListener('click', () => {
        if (video.paused) video.play();
      }, { once: true });
    }
  </script>
  <script src="js/script.js"></script>
</body>

</html>
